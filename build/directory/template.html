<script>

/*@core:js/places.js*/

/*@core:js/text-time.js*/
/*@core:js/records.js*/
/* ---------- controls ---------- */
const $ = id => document.getElementById(id);
const fs = $("f-support");

/* ---------- prepare data (re-run when a different records file is loaded) ---------- */
let ALL = [], C = [], S = [], T = [];
function prepare(rows) {
  ALL = shapeRecords(rows);
  C = ALL.filter(s => s.type === "Course");
  S = ALL.filter(s => s.type !== "Course" && split(s.mode).includes("in-person"));
  T = ALL.filter(s => s.type !== "Course" && !split(s.mode).includes("in-person"));  // services with a place live on the In person tab
  fs.innerHTML = supportOptions(S); $("t-support").innerHTML = supportOptions(T); $("c-support").innerHTML = supportOptions(C);
  $("f-town").innerHTML = `<option value="">All of Somerset</option>` +
    PLACES.map(([g, ps]) => `<optgroup label="${esc(g)}">` + [...ps].sort((x, y) => x[0].localeCompare(y[0])).map(([n]) => `<option>${esc(n)}</option>`).join("") + `</optgroup>`).join("") +
    `<option value="__pt" hidden>Point on map</option>`;

prepare(DATA);
$("today").textContent = new Date().toLocaleDateString("en-GB", { weekday: "short", day: "numeric", month: "short" });

let origin = null, sortBy = "soon", fitPending = true, locMsg = "";

function windowFor(v, now) {

function render() {
  setTimeout(syncLink, 0);   // keep the address bar in step with the filters
  if (LIVE_ONLY && !ALL.length) { panelMessage(liveMsg); return; }

  $("s-near").disabled = !origin; if (!origin && sortBy === "near") sortBy = "soon";

  if (origin && rad) rows = rows.filter(r => r.d != null && r.d <= rad);

  else if (win) {
    checkRows = rows.filter(r => r.s._kind !== "dated");
    rows = rows.filter(r => r.s._kind === "dated" && occurrences(r.s, win[0], Math.ceil((win[1] - dayStart(win[0])) / 864e5)).some(o => o.en > win[0] && o.st < win[1]));
  } else { checkRows = rows.filter(r => !r.nx.at); rows = rows.filter(r => r.nx.at); }

  if (kindsOff.size) { rows = rows.filter(r => !kindsOff.has(kindOf(r.s))); checkRows = checkRows.filter(r => !kindsOff.has(kindOf(r.s))); }

  if (!btn || !("geolocation" in navigator)) return;
  btn.hidden = false;
  btn.onclick = () => {
    btn.disabled = true; locMsg = "Finding your location…"; render();
    navigator.geolocation.getCurrentPosition(p => {
      btn.disabled = false; locMsg = "";
      origin = { lat: p.coords.latitude, lon: p.coords.longitude, label: "your location" };
      setPtLabel("Your location"); $("f-town").value = "__pt"; sortBy = "near"; fitPending = true; render();
    }, err => {
      btn.disabled = false;
      locMsg = err.code === 1 ? "Location not allowed" : "Location not found"; render();
      setTimeout(() => { locMsg = ""; render(); }, 5000);
    }, { enableHighAccuracy: false, timeout: 12000, maximumAge: 600000 });
  };
})();
$("s-near").onclick = () => { sortBy = "near"; render(); };
$("list").addEventListener("mouseover", e => { const c = e.target.closest(".card"); document.querySelectorAll(".pin.hot, .cpin.hot").forEach(p => p.classList.remove("hot"));
  const m = c && markers[c.dataset.id]; if (m) m.getElement()?.firstElementChild?.classList.add("hot"); });
$("list").addEventListener("click", e => {
  if (e.target.closest("#show-month")) { $("f-when").value = "month"; fitPending = true; render(); return; }
  if (e.target.closest("a, .copy")) return; const c = e.target.closest(".card"); if (!c) return; c.classList.toggle("open");
  const m = markers[c.dataset.id]; if (m && map && mapVisible()) { map.flyTo(m.getLatLng(), Math.max(map.getZoom(), 15), { duration: .5 }); m.openTooltip(); } });
function setTab(t) { $("main").classList.toggle("show-map", t === "map"); $("t-list").setAttribute("aria-pressed", t === "list"); $("t-map").setAttribute("aria-pressed", t === "map");
  if (t === "map" && map) setTimeout(() => { map.invalidateSize(); fitPending = true; render(); }, 30); }
$("t-list").onclick = () => setTab("list"); $("t-map").onclick = () => setTab("map");
addEventListener("resize", () => map && map.invalidateSize());
/* ---------- links that open the directory already filtered ----------
   e.g. /directory/?support=bereavement&town=Frome#near · ?lat=51.21&lon=-3.6&label=near%20Porlock#near · ?support=anxiety#talk
   support (any tab), town or lat + lon (+ label), within and when (In person). Unknown values are ignored, so a bad link still
   opens the normal page. The address bar follows the filters, so any view can be copied as a link (never "Use my location"). */
// Without a link, the choices made earlier in this visit come back (kept in this browser tab only, never "Use my location"),
// so going to Places and back, or reloading, doesn't reset them.
const STATE_KEY = "ss-directory:" + location.pathname;   // the live and test copies keep their own
const SAVED = (() => { try { return location.search ? {} : JSON.parse(sessionStorage.getItem(STATE_KEY) || "null") || {}; } catch (e) { return {}; } })();
const LINK = (() => { try { return new URLSearchParams(location.search || SAVED.near || ""); } catch (e) { return new URLSearchParams(); } })();
let recordsIn = false;   // nothing is remembered until the records (and so every choice) are in place
let userChanged = false;
document.addEventListener("change", e => { if (e.isTrusted) userChanged = true; }, true);
function pickOpt(sel, v) {
  if (!sel || v == null || String(v).trim() === "") return false;
  const o = [...sel.options].find(o => !o.hidden && o.value.toLowerCase() === String(v).trim().toLowerCase());
  if (o) sel.value = o.value;
  return !!o;
}
function applyLink() {   // after the records are ready, and again when the live sheet arrives, until the person changes something
  if (userChanged) return;
  applyLinkNear();
  if (SAVED.near !== undefined) restoreOthers();   // after: In person's choices also set the other tabs' Support for
}
function applyLinkNear() {
  if (![...LINK.keys()].length) return;
  const sup = LINK.get("support");
  pickOpt(fs, sup); pickOpt($("t-support"), sup); pickOpt($("c-support"), sup);
  const lat = parseFloat(LINK.get("lat")), lon = parseFloat(LINK.get("lon"));
  if (pickOpt($("f-town"), LINK.get("town")) && PLACE[$("f-town").value]) {
    const n = $("f-town").value; origin = { lat: PLACE[n][0], lon: PLACE[n][1], label: n }; sortBy = "near";
  } else if (lat > 50.5 && lat < 51.7 && lon > -4.2 && lon < -1.9) {   // a point in or near the area
    const label = (LINK.get("label") || "").replace(/[<>"]/g, "").trim().slice(0, 60) || "the point on the map";
    origin = { lat, lon, label, link: true }; setPtLabel(cap(label)); $("f-town").value = "__pt"; sortBy = "near";
  }
  pickOpt($("within"), LINK.get("within")); pickOpt($("f-when"), LINK.get("when"));
  fitPending = true;
}
function restoreOthers() {   // the other tabs' choices from earlier in this visit (In person's come back through LINK)
  const sup = (sel, q) => { const v = new URLSearchParams(q || "").get("support"); if (!pickOpt(sel, v)) sel.value = ""; };
  sup($("t-support"), SAVED.talk); sup($("c-support"), SAVED.course);
  if (SAVED.area !== undefined) pickOpt($("t-area"), SAVED.area) || ($("t-area").value = "");
  if (SAVED.fmt !== undefined) pickOpt($("c-fmt"), SAVED.fmt) || ($("c-fmt").value = "");
  $("t-open").checked = !!SAVED.open; $("c-book").checked = !!SAVED.book;
}
function saveState() {
  if (!recordsIn) return;
  try { sessionStorage.setItem(STATE_KEY, JSON.stringify({ near: linkFor("near"), talk: linkFor("talk"), course: linkFor("course"), sort: sortBy,
    area: $("t-area").value, open: $("t-open").checked, fmt: $("c-fmt").value, book: $("c-book").checked })); } catch (e) {}
}
function linkFor(t) {   // the current filters, as the part of the address after "?"
  const q = new URLSearchParams();
  if (t === "near") {
    if (fs.value) q.set("support", fs.value);
    const n = $("f-town").value;
    if (PLACE[n]) q.set("town", n);
    else if (n === "__pt" && origin && origin.link) { q.set("lat", origin.lat.toFixed(4)); q.set("lon", origin.lon.toFixed(4)); q.set("label", origin.label); }
    if (origin && $("within").value !== "10") q.set("within", $("within").value);
    if ($("f-when").value !== "week") q.set("when", $("f-when").value);
  } else if (t === "talk" && $("t-support").value) q.set("support", $("t-support").value);
  else if (t === "course" && $("c-support").value) q.set("support", $("c-support").value);
  return q.toString();
}
function syncLink() { try { const q = linkFor(tab); history.replaceState(null, "", location.pathname + (q ? "?" + q : "") + "#" + tab); } catch (e) {} saveState(); }

// Places: back to the page last looked at there in this visit (a town, with its choices), if any
$("tab-places").onclick = e => { try {
  const home = new URL("places/", location.href).pathname, p = JSON.parse(sessionStorage.getItem("ss-places:" + home) || "null");
  if (p && p.url && p.url.startsWith(home)) { e.preventDefault(); location.href = p.url; } } catch (_) {} };
// Opens on In person; a link with #near, #talk, #course or #about opens that tab. Old links to #assist go to the tools page.
(function () {
  if (location.hash === "#assist") { location.replace(TOOLS_URL + "#assist"); return; }
  applyLink();
  const fromHash = SITE_TABS.includes(location.hash.slice(1)) ? location.hash.slice(1) : "";
  setSiteTab(fromHash || "near");
})();

/*@core:js/sheet.js*/
function applyRecords(recs) {  // (also refreshes the About counts)
  const keepTown = $("f-town").value, keepOrigin = origin;   // a place chosen while the live sheet was loading
  prepare(recs);
  fitPending = true;
  if (keepOrigin && (keepTown === "__pt" || PLACE[keepTown])) {
    if (keepTown === "__pt") setPtLabel(keepOrigin.label === "your location" ? "Your location" : "Point on map");
    $("f-town").value = keepTown; origin = keepOrigin;
  } else { $("f-town").value = ""; origin = null; sortBy = "soon"; }
  applyLink();
  if (!userChanged && SAVED.sort && origin) sortBy = SAVED.sort;   // Soonest or Nearest, as it was
  recordsIn = true;
  setSiteTab(tab);
}
function showSource(txt) { const el = $("datasrc"); el.textContent = txt; el.hidden = !txt; }
function panelMessage(html) { for (const id of ["talk", "courses", "list"]) $(id).innerHTML = `<div class="empty">${html}</div>`; $("summary").textContent = ""; }
if (SHEET_CSV_URL) {
  // Records already loaded earlier in this visit show straight away; the sheet is still checked, and only a change redraws the page
  const kept = cachedRecords();
  if (kept) { try { applyRecords(kept); } catch (e) { console.error("Display error (kept records)", e); } }
  else if (LIVE_ONLY) { showSource(""); panelMessage(liveMsg); } else showSource("Loading the latest records…");
  fetchRecords()
    .then(recs => {
      if (sameRecords(recs, kept)) return showSource("");
      try { applyRecords(recs); }
      catch (e) { console.error("Display error", e); showSource(`${recs.length} services loaded, but something went wrong showing them (${e && e.message}). Please send this message to the maintainer.`); return; }
      showSource("");   // success needs no message; problems are still reported here
    })
    .catch(e => {
      console.error("Sheet load error", e);
      if (kept) return;   // still showing the records from earlier in this visit
      if (LIVE_ONLY) {
        showSource("");
        panelMessage(liveMsg = `<strong>Services can't be loaded right now.</strong><br>Please <a href="" onclick="location.reload();return false">try again</a> in a moment. If you need to talk to someone now, call Samaritans on <a href="tel:116123">116 123</a>.<br><small style="color:#78716C">Technical detail: ${esc(String(e && e.message || e))}</small>`);
      } else showSource(`Couldn't reach the shared sheet, so this is the saved copy from ${BUILT}.`);
    });
}
/*TRIAL*/
setInterval(() => { if (!ALL.length) return; tab === "talk" ? renderTalk() : tab === "course" ? renderCourses() : render(); }, 5 * 60 * 1000);
</script>

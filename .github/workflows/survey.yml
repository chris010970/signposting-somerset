# Page survey (build/watch/survey.py): fetches every service's web page once, checks whether each record's details
# are on it, and commits the report to results/watch/. Runs only when started by hand:
# GitHub → Actions → "Survey pages" → Run workflow. Changes nothing in the sheet or on the site.
# After it has committed, GitHub Desktop will ask you to pull before your next push ("Fetch origin", then "Pull origin").
name: Survey pages
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: places   # shares a queue with the Places rebuild, so the two never push at the same time
jobs:
  survey:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Survey the pages
        run: python build/watch/survey.py
      - name: Commit the report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/watch
          git commit -m "Watch: page survey" || { echo "Nothing to commit"; exit 0; }
          git pull --rebase -q
          git push

# Runs build/tests/run_tests.py on every push and pull request: the builds' tests, the schedule rules,
# that the directory and tools pages still build, that every link in docs/ works, and the browser tests
# (what the pages show, the Places cards, valid HTML, accessibility).
# A red cross next to a commit on GitHub means something failed: open it to see which check.
name: Tests
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Install the browser test tools
        working-directory: build/tests
        run: npm ci
      - name: Install the browser (Chromium)
        working-directory: build/tests
        run: npx playwright install --with-deps chromium
      - run: python build/tests/run_tests.py
